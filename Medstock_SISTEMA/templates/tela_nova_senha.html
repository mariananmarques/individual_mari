<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Nova senha - MEDSTOCK</title>

    <style>

        /* ==========================================================
           RESET
        ========================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ==========================================================
           BODY
        ========================================================== */

        body {
            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    110deg,
                    #003b82 0%,
                    #005f92 42%,
                    #00b8b8 100%
                );
            padding: 0;
            overflow: hidden;
        }


        /* ==========================================================
           ANIMAÇÃO
        ========================================================== */

        @keyframes aparecer {

            from {
                opacity: 0;
                transform:
                    translateY(25px)
                    scale(0.98);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* ==========================================================
           CARD
        ========================================================== */

        .card {
            width: 476px;
            max-width: calc(100% - 30px);
            min-height: 665px;
            background: #f2f2f2;
            border-radius: 20px;
            padding:
                48px
                50px
                38px
                50px;
            box-shadow:
                0 20px 55px
                rgba(0, 0, 0, 0.28);
            animation:
                aparecer 0.6s ease-out;
            text-align: center;
        }


        /* ==========================================================
           LOGO
        ========================================================== */

        .logo {
            width: 120px;
            height: 120px;
            margin:
                0 auto
                12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 50%;
            transition:
                transform 0.3s ease;
        }


        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }


        .logo:hover {
             transform:
                scale(1.04);
        }


        /* ==========================================================
           MARCA
        ========================================================== */

        .brand {
            font-size: 29px;
            line-height: 1;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #292929;
            margin-bottom: 24px;
        }


        /* ==========================================================
           DESCRIÇÃO
        ========================================================== */

        .description {
            font-size: 15px;
            line-height: 1.5;
            color: #666666;
            margin-bottom: 32px;
        }


        /* ==========================================================
           GRUPO DO INPUT
        ========================================================== */

        .input-group {
            width: 100%;
            margin-bottom: 26px;
            text-align: left;
        }


        .input-group label {
            display: block;
            font-size: 18px;
            font-weight: 400;
            color: #303030;
            margin-bottom: 10px;
        }


        /* ==========================================================
           INPUT
        ========================================================== */

        input {
            width: 100%;
            height: 48px;
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid #d5d8dc;
            border-radius: 8px;
            overflow: hidden;
            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }


        input:focus-within {
            border-color: #008bb0;
            box-shadow:
                0 0 0 3px
                rgba(0, 139, 176, 0.12);
        }


        /* ==========================================================
           BOTÃO
        ========================================================== */

        button {
            width: 100%;
            height: 48px;
            margin-top: 8px;
            border: none;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            color: #ffffff;
            font-size: 18px;
            font-weight: 500;
            background:
                linear-gradient(
                    90deg,
                    #003b8f 0%,
                    #005b9d 48%,
                    #00b8b8 100%
                );
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        button:hover {
            filter: brightness(1.05);
            transform:
                translateY(-1px);
            box-shadow:
                0 7px 18px
                rgba(0, 65, 130, 0.28);
        }

        button:active {
            transform:
                translateY(0);
            box-shadow: none;
        }

        button i {
            margin-right: 8px;
        }

        /* ==========================================================
           FOOTER
        ========================================================== */

        .footer {
            margin-top: 31px;
            font-size: 13px;
            color: #777777;
        }

        /* ==========================================================
           RESPONSIVIDADE
        ========================================================== */

        @media (max-width: 600px) {

            body {
                overflow-y: auto;
                padding: 20px 0;
            }


            .card {
                width: calc(100% - 30px);
                min-height: auto;
                padding:
                    38px
                    25px
                    30px;
            }

            .logo {
                width: 105px;
                height: 105px;
            }

            .brand {
                font-size: 26px;
                margin-bottom: 20px;
            }

            .input-group label {
                font-size: 16px;
            }

        }


        /* ==========================================================
           TELAS BAIXAS
        ========================================================== */

        @media (max-height: 700px) {

            body {
                overflow-y: auto;
                padding: 20px 0;
            }

            .card {
                min-height: auto;
                padding-top: 30px;
                padding-bottom: 30px;
            }

            .logo {
                width: 90px;
                height: 90px;
            }

            .brand {
                margin-bottom: 18px;
            }

            .description {
                margin-bottom: 22px;
            }
        }

    </style>

</head>

<body>
    <div class="card">
        <div class="logo">

            <img
                src="{{ url_for('static', filename='img/medstock_logo_sf.png') }}"
                alt="Logo MEDSTOCK"
            >

        </div>

        <h1 class="brand">
            MEDSTOCK
        </h1>
        <h1>Redefinir senha</h1>

        <p class="description">
            Digite sua nova senha.
        </p>

        <form
            method="POST"
            action="{{ url_for('salvar_nova_senha') }}"
        >

            <div class="input-group">

                <label>
                    Nova senha
                </label>

                <input
                    type="password"
                    name="nova_senha"
                    placeholder="Digite sua nova senha"
                    required
                >

            </div>

            <br>


            <div class="input-group">
                <label>
                    Confirmar nova senha
                </label>
                <input
                    type="password"
                    name="confirmar_senha"
                    placeholder="Confirme sua nova senha"
                    required
                >
            </div>


            <br>

            <button type="submit">
                Redefinir senha
            </button>

        </form>
    </div>

</body>

</html>
