{% extends 'tela_home.html' %}

{% block conteudo %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/tela_perfil_do_usuario.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<div class="profile-wrapper">
    <div class="profile-card">
        <!-- Banner Superior com Gradiente da Marca -->
        <div class="profile-header">
            <div class="profile-avatar-container">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Default_pfp.svg/500px-Default_pfp.svg.png" alt="Foto do Usuário" class="profile-avatar">
                <span class="status-indicator" title="Sessão Ativa"></span>
            </div>
        </div>

        <!-- Conteúdo Principal -->
        <div class="profile-body">
            <div class="text-center mb-4">
                <h3 class="user-name">{{ cliente.nome }}</h3>
                <span class="user-role-badge">
                    <i class="bi bi-shield-check"></i> Operador de Estoque
                </span>
            </div>

            <!-- Grid de Informações -->
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-icon">
                        <i class="bi bi-person"></i>
                    </div>
                    <div class="info-content">
                        <label>Nome Completo</label>
                        <p>{{ cliente.nome }}</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="bi bi-envelope"></i>
                    </div>
                    <div class="info-content">
                        <label>E-mail Corporativo</label>
                        <p>{{ cliente.email }}</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="bi bi-card-heading"></i>
                    </div>
                    <div class="info-content">
                        <label>CPF</label>
                        <p>{{ cliente.cpf }}</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="bi bi-building-gear"></i>
                    </div>
                    <div class="info-content">
                        <label>Sistema / Nível</label>
                        <p>MEDSTOCK — Acesso Padrão</p>
                    </div>
                </div>
            </div>

            <!-- Divisor -->
            <hr class="profile-divider">

            <!-- Botões de Ação -->
            <div class="action-buttons">
                <a href="{{ url_for('logout2') }}" class="btn-medstock btn-switch">
                    <i class="bi bi-people"></i>
                    <span>Trocar de Conta</span>
                </a>
                <a href="{{ url_for('logout') }}" class="btn-medstock btn-logout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Sair da Conta</span>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
