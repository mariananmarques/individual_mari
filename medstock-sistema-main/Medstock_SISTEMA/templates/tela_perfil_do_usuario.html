{% extends 'tela_home.html' %}

{% block conteudo %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/tela_perfil_do_usuario.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<div class="profile-wrapper">
    <div class="profile-card">
        <!-- Banner Superior com Gradiente da Marca -->
        <div class="profile-header">
            <div class="profile-avatar-container">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Default_pfp.svg/500px-Default_pfp.svg.png" alt="Foto do Usuário" class="profile-avatar">
                <span class="status-indicator" title="Sessão Ativa"></span>
            </div>
        </div>

        <!-- Conteúdo Principal -->
        <div class="profile-body">
            <div class="text-center mb-4">
                <h3 class="user-name">{{ cliente.nome }}</h3>
                <span class="user-role-badge">
                    <i class="bi bi-shield-check"></i> Operador de Estoque
                </span>
            </div>

            <!-- Grid de Informações -->
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-icon">
                        <i class="bi bi-person"></i>
                    </div>
                    <div class="info-content">
                        <label>Nome Completo</label>
                        <p>{{ cliente.nome }}</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="bi bi-envelope"></i>
                    </div>
                    <div class="info-content">
                        <label>E-mail Corporativo</label>
                        <p>{{ cliente.email }}</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="bi bi-card-heading"></i>
                    </div>
                    <div class="info-content">
                        <label>CPF</label>
                        <p>{{ cliente.cpf }}</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="bi bi-building-gear"></i>
                    </div>
                    <div class="info-content">
                        <label>Sistema / Nível</label>
                        <p>MEDSTOCK — Acesso Padrão</p>
                    </div>
                </div>
            </div>

            <!-- ================= ACESSIBILIDADE (NOVO) ================= -->
            <div class="a11y-section">
                <button type="button"
                        class="info-item a11y-toggle"
                        id="a11yToggle"
                        aria-expanded="false"
                        aria-controls="a11yPanel">
                    <div class="info-icon">
                        <i class="bi bi-universal-access-circle"></i>
                    </div>
                    <div class="info-content">
                        <label>Acessibilidade</label>
                        <p>Recursos para deficientes visuais</p>
                    </div>
                    <i class="bi bi-chevron-down a11y-chevron" aria-hidden="true"></i>
                </button>

                <div class="a11y-panel" id="a11yPanel" hidden>
                    <!-- Tamanho do texto -->
                    <div class="a11y-group">
                        <span class="a11y-group-title">Tamanho do texto</span>
                        <div class="a11y-row">
                            <button type="button" class="a11y-option" data-action="text-down" aria-label="Diminuir tamanho do texto">
                                <i class="bi bi-dash-circle"></i><span>Diminuir</span>
                            </button>
                            <span class="a11y-level" id="a11yTextLevel" aria-live="polite">100%</span>
                            <button type="button" class="a11y-option" data-action="text-up" aria-label="Aumentar tamanho do texto">
                                <i class="bi bi-plus-circle"></i><span>Aumentar</span>
                            </button>
                        </div>
                    </div>

                    <!-- Opções liga/desliga -->
                    <div class="a11y-group">
                        <span class="a11y-group-title">Visual</span>
                        <div class="a11y-grid">
                            <button type="button" class="a11y-option" data-toggle="a11y-contrast" aria-pressed="false">
                                <i class="bi bi-circle-half"></i><span>Alto contraste</span>
                            </button>
                            <button type="button" class="a11y-option" data-toggle="a11y-dark" aria-pressed="false">
                                <i class="bi bi-moon-stars"></i><span>Modo escuro</span>
                            </button>
                            <button type="button" class="a11y-option" data-toggle="a11y-gray" aria-pressed="false">
                                <i class="bi bi-droplet-half"></i><span>Escala de cinza</span>
                            </button>
                            <button type="button" class="a11y-option" data-toggle="a11y-links" aria-pressed="false">
                                <i class="bi bi-link-45deg"></i><span>Destacar links</span>
                            </button>
                            <button type="button" class="a11y-option" data-toggle="a11y-cursor" aria-pressed="false">
                                <i class="bi bi-cursor"></i><span>Cursor grande</span>
                            </button>
                            <button type="button" class="a11y-option" data-toggle="a11y-motion" aria-pressed="false">
                                <i class="bi bi-slash-circle"></i><span>Parar animações</span>
                            </button>
                        </div>
                    </div>

                    <div class="a11y-group">
                        <span class="a11y-group-title">Leitura</span>
                        <div class="a11y-grid">
                            <button type="button" class="a11y-option" data-toggle="a11y-font" aria-pressed="false">
                                <i class="bi bi-fonts"></i><span>Fonte legível</span>
                            </button>
                            <button type="button" class="a11y-option" data-toggle="a11y-spacing" aria-pressed="false">
                                <i class="bi bi-text-paragraph"></i><span>Espaçamento maior</span>
                            </button>
                            <button type="button" class="a11y-option" data-action="read" id="a11yRead" aria-pressed="false">
                                <i class="bi bi-volume-up"></i><span>Ler a página</span>
                            </button>
                        </div>
                    </div>

                    <button type="button" class="a11y-reset" data-action="reset">
                        <i class="bi bi-arrow-counterclockwise"></i>
                        <span>Restaurar padrão</span>
                    </button>
                </div>
            </div>

            <!-- Divisor -->
            <hr class="profile-divider">

            <!-- Botões de Ação -->
            <div class="action-buttons">
                <a href="{{ url_for('logout2') }}" class="btn-medstock btn-switch">
                    <i class="bi bi-people"></i>
                    <span>Trocar de Conta</span>
                </a>
                <a href="{{ url_for('logout') }}" class="btn-medstock btn-logout">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Sair da Conta</span>
                </a>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    var STORAGE_KEY = 'medstock_a11y';
    var root = document.documentElement;
    var toggleBtn = document.getElementById('a11yToggle');
    var panel = document.getElementById('a11yPanel');
    var levelLabel = document.getElementById('a11yTextLevel');
    var readBtn = document.getElementById('a11yRead');
    var TEXT_STEPS = [100, 110, 125, 150, 175];
    var state = { text: 0, flags: {} };

    function load() {
        try {
            var saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if (saved) state = saved;
        } catch (e) {}
    }

    function save() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function apply() {
        root.style.setProperty('--a11y-zoom', TEXT_STEPS[state.text] / 100);
        levelLabel.textContent = TEXT_STEPS[state.text] + '%';
        document.querySelectorAll('[data-toggle]').forEach(function (btn) {
            var cls = btn.getAttribute('data-toggle');
            var on = !!state.flags[cls];
            root.classList.toggle(cls, on);
            btn.setAttribute('aria-pressed', on);
            btn.classList.toggle('active', on);
        });
        root.classList.toggle('a11y-zoomed', state.text > 0);
    }

    function stopReading() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        readBtn.classList.remove('active');
        readBtn.setAttribute('aria-pressed', 'false');
    }

    toggleBtn.addEventListener('click', function () {
        var open = toggleBtn.getAttribute('aria-expanded') === 'true';
        toggleBtn.setAttribute('aria-expanded', !open);
        toggleBtn.classList.toggle('open', !open);
        panel.hidden = open;
    });

    panel.addEventListener('click', function (ev) {
        var btn = ev.target.closest('button');
        if (!btn) return;

        var cls = btn.getAttribute('data-toggle');
        var action = btn.getAttribute('data-action');

        if (cls) {
            state.flags[cls] = !state.flags[cls];
            // modo escuro e alto contraste não combinam entre si
            if (state.flags[cls] && cls === 'a11y-contrast') state.flags['a11y-dark'] = false;
            if (state.flags[cls] && cls === 'a11y-dark') state.flags['a11y-contrast'] = false;
        } else if (action === 'text-up') {
            state.text = Math.min(state.text + 1, TEXT_STEPS.length - 1);
        } else if (action === 'text-down') {
            state.text = Math.max(state.text - 1, 0);
        } else if (action === 'reset') {
            state = { text: 0, flags: {} };
            stopReading();
        } else if (action === 'read') {
            if (!('speechSynthesis' in window)) {
                alert('Seu navegador não suporta leitura em voz alta.');
                return;
            }
            if (readBtn.classList.contains('active')) {
                stopReading();
            } else {
                var texto = document.querySelector('.profile-card').innerText;
                var fala = new SpeechSynthesisUtterance(texto);
                fala.lang = 'pt-BR';
                fala.onend = stopReading;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(fala);
                readBtn.classList.add('active');
                readBtn.setAttribute('aria-pressed', 'true');
            }
            return;
        }
        save();
        apply();
    });

    window.addEventListener('beforeunload', stopReading);

    load();
    apply();
})();
</script>
{% endblock %}
